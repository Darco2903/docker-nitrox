name: Docker image

on:
  push:
    branches: [main]
  pull_request:
  # Weekly rebuild: picks up new Nitrox releases and base image updates
  # schedule:
  #   - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      nitrox_version:
        description: Nitrox release tag to build (e.g. 1.8.1.0). Empty for the latest release.
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Resolve "latest" here so the image is tagged with the exact Nitrox version it contains
      - name: Resolve Nitrox release
        id: nitrox
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.nitrox_version }}
        run: |
          version="${INPUT_VERSION:-$(gh api repos/SubnauticaNitrox/Nitrox/releases/latest --jq .tag_name)}"
          echo "Nitrox $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/nitrox
          tags: |
            type=raw,value=${{ steps.nitrox.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && inputs.nitrox_version == '' }}
            type=sha
          # metadata-action defaults these to the repo's values (MIT only)
          labels: |
            org.opencontainers.image.licenses=MIT AND GPL-3.0-only
            org.opencontainers.image.version=${{ steps.nitrox.outputs.version }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: NITROX_RELEASE=tags/${{ steps.nitrox.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
